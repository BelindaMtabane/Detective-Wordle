
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Mayhem - The Royal Debt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">

        <header>
            <h1>👑 MEMORY MAYHEM</h1>
            <p>THE ROYAL DEBT</p>
        </header>

        <section id="startScreen" class="screen">
            <h2>The King has your money!</h2>
            <p>Defeat King Reginald in a memory battle to escape your debt.</p>
            <button id="startButton">START BATTLE</button>
        </section>

        <section id="gameScreen" class="screen hidden">

            <div class="battle-info">
                <div class="fighter">
                    <h3>👑 KING REGINALD</h3>
                    <p>Pairs: <span id="kingScore">0</span></p>
                </div>

                <div class="fighter player">
                    <h3>🧑 YOU</h3>
                    <p>Pairs: <span id="playerScore">0</span></p>
                </div>
            </div>

            <div class="game-status">
                <span id="turnDisplay">YOUR TURN</span>
                <span id="message">Find matching cards!</span>
            </div>

            <div id="cardBoard" class="card-board"></div>

            <section class="abilities">
                <h3>YOUR SPECIAL CARDS</h3>

                <div class="ability-buttons">
                    <button data-ability="hint">🔮 Lucky Hint</button>
                    <button data-ability="swap">🪄 Switcheroo</button>
                    <button data-ability="shuffle">🌀 Royal Shuffle</button>
                    <button data-ability="chaos">💥 Chaos Card</button>
                    <button data-ability="shield">🛡️ Royal Shield</button>
                </div>
            </section>

        </section>

        <section id="endScreen" class="screen hidden">
            <h2 id="resultTitle">Battle Complete!</h2>
            <p id="resultMessage"></p>
            <button id="restartButton">PLAY AGAIN</button>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
